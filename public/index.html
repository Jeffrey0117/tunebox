<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tunebox</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0c10;
    --surface: #12151c;
    --surface-2: #1a1e28;
    --border: #232835;
    --text: #edeef2;
    --muted: #8e93a3;
    --faint: #565c6b;
    --accent: #4ade80;
    --on-accent: #052e16;
    --danger: #f87171;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text);
         min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
         -webkit-tap-highlight-color: transparent; }
  .card { width: 100%; max-width: 400px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .brand .icon { color: var(--accent); display: flex; }
  .brand .icon svg { width: 30px; height: 30px; stroke: currentColor; stroke-width: 2; fill: none;
                     stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 32px; letter-spacing: .5px; font-weight: 800; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 34px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 18px 0 6px; }
  input { width: 100%; padding: 13px 14px; font-size: 16px; border-radius: var(--radius);
          border: 1px solid var(--border); background: var(--surface); color: var(--text); outline: none;
          transition: border-color .15s; }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: var(--accent); }
  button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 10px;
           padding: 14px; font-size: 16px; font-weight: 700; border: none; border-radius: var(--radius);
           cursor: pointer; transition: transform .08s; }
  button:active { transform: scale(.98); }
  button .icon svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.5; fill: none;
                     stroke-linecap: round; stroke-linejoin: round; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .secondary { background: var(--surface-2); color: var(--text); }
  @media (hover: hover) {
    .primary:hover { background: #5fe693; }
    .secondary:hover { background: #222736; }
  }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12px; margin: 28px 0 6px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  #code { letter-spacing: 3px; font-family: ui-monospace, SFMono-Regular, monospace; text-transform: uppercase; }
  .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
    <h1>tune<span>box</span></h1>
  </div>
  <div class="sub">共享點歌機 — 一支手機接音響播放，<br>其他人改歌單、遙控。</div>

  <label for="name">歌單名稱</label>
  <input id="name" placeholder="我們的歌單" maxlength="100">
  <button class="primary" id="create">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>建立新房間
  </button>

  <div class="divider">或加入現有房間</div>
  <label for="code">房號（6 碼）</label>
  <input id="code" placeholder="K7MPX2" maxlength="6" autocapitalize="characters" autocomplete="off">
  <button class="secondary" id="join">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg></span>加入
  </button>
  <div class="err" id="err"></div>
</div>
<script>
  const err = (m) => { document.getElementById('err').textContent = m || ''; };
  document.getElementById('create').onclick = async () => {
    err();
    try {
      const res = await fetch('/api/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: document.getElementById('name').value.trim() || undefined }) });
      const body = await res.json();
      if (!body.success) return err(body.error || '建立失敗');
      location.href = '/r/' + body.data.id;
    } catch { err('連不上伺服器'); }
  };
  const join = async () => {
    err();
    const code = document.getElementById('code').value.trim().toUpperCase();
    if (!/^[A-Z0-9]{6}$/.test(code)) return err('房號是 6 碼英數字');
    const res = await fetch('/api/rooms/' + code).catch(() => null);
    const body = res && await res.json().catch(() => null);
    if (!body?.success) return err('找不到這個房間');
    location.href = '/r/' + code;
  };
  document.getElementById('join').onclick = join;
  document.getElementById('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });
</script>
</body>
</html>
