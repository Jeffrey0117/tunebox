<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tunebox</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0c10;
    --surface: #12151c;
    --surface-2: #1a1e28;
    --border: #232835;
    --text: #edeef2;
    --muted: #8e93a3;
    --faint: #565c6b;
    --accent: #4ade80;
    --on-accent: #052e16;
    --accent-dim: #12231a;
    --danger: #f87171;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text);
         min-height: 100dvh; padding-bottom: 118px; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 640px; margin: 0 auto; }

  .icon { display: inline-flex; flex-shrink: 0; }
  .icon svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none;
              stroke-linecap: round; stroke-linejoin: round; }

  header { padding: 16px 16px 12px; display: flex; align-items: center; gap: 10px; }
  header .logo { color: var(--accent); display: flex; }
  header .logo svg { width: 22px; height: 22px; }
  header .name { font-size: 18px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .2px; }
  .codechip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent);
              letter-spacing: 2px; font-family: ui-monospace, SFMono-Regular, monospace; cursor: pointer;
              border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; }
  .codechip .icon svg { width: 14px; height: 14px; }

  .addbar { display: flex; gap: 8px; padding: 0 16px 12px; }
  .addbar input { flex: 1; padding: 12px 14px; font-size: 15px; border-radius: var(--radius); border: 1px solid var(--border);
                  background: var(--surface); color: var(--text); outline: none; min-width: 0; transition: border-color .15s; }
  .addbar input::placeholder { color: var(--faint); }
  .addbar input:focus { border-color: var(--accent); }
  .addbar button { display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; font-size: 15px; font-weight: 700;
                   border: none; border-radius: var(--radius); background: var(--accent); color: var(--on-accent); cursor: pointer; }
  .msg { padding: 0 16px 8px; font-size: 13px; color: var(--danger); min-height: 18px; }

  /* search results panel */
  #results { margin: 0 16px 12px; border: 1px solid var(--border); border-radius: var(--radius);
             background: var(--surface); overflow: hidden; display: none; }
  #results.open { display: block; }
  .rhead { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted);
           border-bottom: 1px solid var(--surface-2); }
  .rhead .q { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rhead .q b { color: var(--text); font-weight: 600; }
  .rhead button { display: flex; background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 4px; }
  .rcard { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--surface-2); }
  .rcard:last-child { border-bottom: none; }
  .rcard img { width: 72px; aspect-ratio: 16/9; object-fit: cover; border-radius: 7px; background: #000; flex-shrink: 0; }
  .rcard .info { flex: 1; min-width: 0; }
  .rcard .rt { font-size: 14px; line-height: 1.35; overflow: hidden;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .rcard .rc { font-size: 12px; color: var(--faint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rcard .act { display: flex; color: var(--muted); flex-shrink: 0; }
  .rcard.added { cursor: default; }
  .rcard.added .rt { color: var(--accent); }
  .rcard.added .act { color: var(--accent); }
  @media (hover: hover) { .rcard:not(.added):hover { background: var(--surface-2); } }

  ul { list-style: none; padding: 0 10px; }
  li { display: flex; align-items: center; gap: 6px; padding: 8px 6px; border-bottom: 1px solid var(--surface-2);
       border-radius: 10px; }
  li.current { background: var(--accent-dim); border-bottom-color: transparent; }
  li .t { flex: 1; min-width: 0; font-size: 15px; line-height: 1.35; overflow: hidden;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  li .t .idx { color: var(--faint); font-size: 12px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  li.current .t { color: var(--accent); }
  li button { display: inline-flex; align-items: center; justify-content: center; background: transparent;
              color: var(--muted); border: none; border-radius: 9px; width: 36px; height: 36px; cursor: pointer; }
  li button.play { color: var(--accent); background: var(--surface-2); }
  li button .icon svg { width: 16px; height: 16px; }
  .empty { padding: 48px 16px; text-align: center; color: var(--faint); font-size: 14px; }

  /* bottom transport bar */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(16, 19, 26, .92);
         backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--border);
         padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .bar .inner { max-width: 640px; margin: 0 auto; }
  .bar .np { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted);
             overflow: hidden; white-space: nowrap; margin-bottom: 6px; }
  .bar .np .icon { color: var(--accent); }
  .bar .np .icon svg { width: 14px; height: 14px; }
  .bar .np b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  input[type=range] { accent-color: var(--accent); height: 22px; margin: 0; cursor: pointer; background: transparent; }
  .seekrow { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .seekrow input { flex: 1; min-width: 0; }
  .seekrow .time { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; flex-shrink: 0; min-width: 36px; }
  .seekrow .time:last-child { text-align: right; }
  .bar .row { display: flex; align-items: center; gap: 10px; }
  .vol { display: flex; align-items: center; gap: 6px; flex: 0 1 150px; min-width: 96px; color: var(--muted); }
  .vol .icon svg { width: 16px; height: 16px; }
  .vol input { flex: 1; min-width: 0; }
  .bar .row .ctl { flex: 1; display: flex; justify-content: center; gap: 14px; }
  @media (max-width: 460px) {
    .mode .label { display: none; }
    .mode { padding: 11px; }
  }
  .ctl button { display: inline-flex; align-items: center; justify-content: center; width: 50px; height: 50px;
                border-radius: 50%; border: none; background: var(--surface-2); color: var(--text); cursor: pointer;
                transition: transform .08s; }
  .ctl button:active { transform: scale(.92); }
  .ctl button svg { width: 20px; height: 20px; }
  .ctl button.big { width: 58px; height: 58px; background: var(--accent); color: var(--on-accent); }
  .ctl button.big svg { width: 24px; height: 24px; }
  .mode { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; padding: 11px 14px;
          border-radius: var(--radius); border: 1px solid var(--border); background: transparent; color: var(--muted);
          cursor: pointer; white-space: nowrap; }
  .mode .icon svg { width: 15px; height: 15px; }
  body.playing .mode { border-color: #2d4a39; color: var(--accent); }

  /* player mode */
  #playerView { display: none; padding: 4px 16px 8px; }
  #yt { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 14px; overflow: hidden; }
  #playerView .nowbig { font-size: 17px; font-weight: 650; margin: 14px 2px 6px; line-height: 1.4; }
  #playerView .hint { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin: 3px 2px; }
  #playerView .hint .icon svg { width: 13px; height: 13px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--accent);
           border: 1px solid #2d4a39; border-radius: 999px; padding: 2px 9px; margin-left: 6px; }
  .badge .icon svg { width: 11px; height: 11px; }
  body.playing #playerView { display: block; }

  @media (hover: hover) {
    li button:hover { background: var(--surface-2); color: var(--text); }
    li button.play:hover { color: var(--accent); }
    .ctl button:hover { background: #222736; }
    .ctl button.big:hover { background: #5fe693; }
    .mode:hover { border-color: #323849; color: var(--text); }
    .codechip:hover { border-color: #323849; }
    .addbar button:hover { background: #5fe693; }
  }

  /* wide screens: player on the left, queue on the right */
  @media (min-width: 960px) {
    body.playing .wrap { display: grid; max-width: 1080px; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
                         gap: 8px 28px; align-items: start; padding: 0 20px; }
    body.playing header { grid-column: 1 / -1; }
    body.playing #playerView { position: sticky; top: 12px; }
    body:not(.playing) .wrap { max-width: 720px; }
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="logo icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
  <div class="name" id="roomName">…</div>
  <button class="codechip" id="codeChip" title="複製房間連結">
    <span id="roomCode"></span>
    <span class="icon" id="copyIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></span>
  </button>
</header>

<div id="playerView">
  <div id="yt"></div>
  <div class="nowbig" id="nowBig">—</div>
  <div class="hint">這支手機是播放端
    <span class="badge"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></span>PLAYER</span>
  </div>
  <div class="hint">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
    保持此頁開著、螢幕不要鎖（已自動保持亮屏）。聲音走這支手機連的藍牙。
  </div>
</div>

<div id="editView">
  <div class="addbar">
    <input id="url" placeholder="打歌名搜尋，或貼 YouTube / Spotify / Apple Music 連結" autocomplete="off" enterkeyhint="search">
    <button id="add"></button>
  </div>
  <div class="msg" id="msg"></div>
  <div id="results"></div>
  <ul id="queue"></ul>
  <div class="empty" id="empty" style="display:none">還沒有歌 — 貼個 YouTube 連結開始吧</div>
</div>
</div>

<div class="bar">
  <div class="inner">
    <div class="np" id="np">尚無播放中的裝置</div>
    <div class="seekrow">
      <span class="time" id="tPos">0:00</span>
      <input type="range" id="seek" min="0" max="0" step="1" value="0" disabled aria-label="播放進度">
      <span class="time" id="tDur">0:00</span>
    </div>
    <div class="row">
      <div class="vol">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></span>
        <input type="range" id="vol" min="0" max="100" step="1" value="100" aria-label="音量">
      </div>
      <div class="ctl">
        <button id="prev" aria-label="上一首"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg></button>
        <button id="toggle" class="big" aria-label="播放/暫停"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg></button>
        <button id="next" aria-label="下一首"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg></button>
      </div>
      <button class="mode" id="modeBtn" aria-label="播放模式"></button>
    </div>
  </div>
</div>

<script>
(() => {
  const roomId = location.pathname.split('/')[2].toUpperCase();
  const $ = (id) => document.getElementById(id);
  let state = null;
  let isPlayer = false;
  // Don't compare the server's status.updatedAt against this phone's clock —
  // track server time per frame instead (phones' clocks drift).
  let serverNow = 0;
  let frameAt = 0;
  const deviceId = `p_${Math.random().toString(36).slice(2, 10)}`;

  // ---- icons (Lucide, MIT — lucide.dev) -----------------------------------
  const SVG_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  const ICONS = {
    play: `${SVG_OPEN}<polygon points="6 4 20 12 6 20 6 4"/></svg>`,
    pause: `${SVG_OPEN}<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>`,
    up: `${SVG_OPEN}<path d="m18 15-6-6-6 6"/></svg>`,
    down: `${SVG_OPEN}<path d="m6 9 6 6 6-6"/></svg>`,
    x: `${SVG_OPEN}<path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`,
    speaker: `${SVG_OPEN}<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`,
    exit: `${SVG_OPEN}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>`,
    check: `${SVG_OPEN}<path d="M20 6 9 17l-5-5"/></svg>`,
    copy: `${SVG_OPEN}<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>`,
    plus: `${SVG_OPEN.replace('stroke-width="2"', 'stroke-width="2.5"')}<path d="M5 12h14"/><path d="M12 5v14"/></svg>`,
    search: `${SVG_OPEN.replace('stroke-width="2"', 'stroke-width="2.5"')}<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`
  };
  const iconEl = (name) => {
    const span = document.createElement('span');
    span.className = 'icon';
    span.innerHTML = ICONS[name]; // constant strings only — never user data
    return span;
  };
  const setIcon = (el, name) => { el.innerHTML = ICONS[name]; };

  // ---- API helpers -------------------------------------------------------
  const api = (route, body) => fetch(`/api/rooms/${roomId}${route}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {})
  }).then((r) => r.json()).catch(() => ({ success: false, error: '連不上伺服器' }));
  const control = (cmd, extra) => api('/control', { cmd, ...extra });
  const flash = (m) => { $('msg').textContent = m || ''; if (m) setTimeout(() => { $('msg').textContent = ''; }, 4000); };

  // ---- rendering ---------------------------------------------------------
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const statusAge = () => (serverNow - (state?.status?.updatedAt || 0)) + (Date.now() - frameAt);
  const statusFresh = () => !!state?.status && statusAge() < 20000;

  function setModeBtn() {
    const btn = $('modeBtn');
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = isPlayer ? '離開播放模式' : '在這支播放';
    btn.replaceChildren(iconEl(isPlayer ? 'exit' : 'speaker'), label);
  }
  setModeBtn();

  function render() {
    if (!state) return;
    $('roomName').textContent = state.name;
    $('roomCode').textContent = state.id;
    document.title = `${state.name} · tunebox`;

    const q = state.queue;
    $('empty').style.display = q.length ? 'none' : '';
    const cur = statusFresh() ? state.status.trackId : null;
    $('queue').replaceChildren(...q.map((t, i) => {
      const li = document.createElement('li');
      li.dataset.trackId = t.id;
      if (t.id === cur) li.classList.add('current');
      const title = document.createElement('div');
      title.className = 't';
      const idx = document.createElement('span');
      idx.className = 'idx';
      idx.textContent = String(i + 1);
      title.append(idx, t.title);
      const mk = (name, cls, fn, label) => {
        const b = document.createElement('button');
        b.append(iconEl(name));
        if (cls) b.className = cls;
        b.onclick = fn;
        b.setAttribute('aria-label', label);
        return b;
      };
      li.append(
        mk('play', 'play', () => control('jump', { trackId: t.id }), '播放這首'),
        title,
        mk('up', '', () => api(`/tracks/${t.id}/move`, { dir: 'up' }), '上移'),
        mk('down', '', () => api(`/tracks/${t.id}/move`, { dir: 'down' }), '下移'),
        mk('x', '', () => api(`/tracks/${t.id}/delete`), '刪除')
      );
      return li;
    }));

    renderStatus();
  }

  // Cheap path for the frequent status events: transport bar + row highlight
  // only — never rebuilds the queue list.
  function renderStatus() {
    const fresh = statusFresh();
    if (fresh) {
      const s = state.status;
      $('np').replaceChildren(iconEl(s.paused ? 'pause' : 'play'));
      const b = document.createElement('b');
      b.textContent = s.title || '—';
      $('np').append(b);
      $('nowBig').textContent = s.title || '—';
      if (!volAdjusting && Number.isFinite(s.volume)) $('vol').value = s.volume;
    } else {
      $('np').textContent = '尚無播放中的裝置 — 按「在這支播放」開始';
    }
    setIcon($('toggle'), fresh && !state.status.paused ? 'pause' : 'play');
    const cur = fresh ? state.status.trackId : null;
    for (const li of $('queue').children) li.classList.toggle('current', li.dataset.trackId === cur);
    updateProgress();
  }

  // ---- progress bar (interpolated between status frames) ------------------
  let seeking = false;
  let volAdjusting = false;
  const playbackPos = () => {
    const s = state.status;
    const pos = s.position + (s.paused ? 0 : statusAge() / 1000);
    return s.duration ? Math.min(pos, s.duration) : pos;
  };
  function updateProgress() {
    const seek = $('seek');
    if (!statusFresh() || !state.status.duration) {
      seek.disabled = true;
      seek.value = 0;
      seek.max = 0;
      $('tPos').textContent = '0:00';
      $('tDur').textContent = '0:00';
      return;
    }
    const s = state.status;
    seek.disabled = false;
    seek.max = Math.floor(s.duration);
    $('tDur').textContent = fmt(s.duration);
    if (!seeking) {
      const pos = playbackPos();
      seek.value = Math.floor(pos);
      $('tPos').textContent = fmt(pos);
    }
  }
  setInterval(() => { if (!seeking) updateProgress(); }, 1000);

  $('seek').addEventListener('input', () => {
    seeking = true;
    $('tPos').textContent = fmt(Number($('seek').value));
  });
  $('seek').addEventListener('change', () => {
    seeking = false;
    const pos = Number($('seek').value);
    if (isPlayer && ytReady) { yt.seekTo(pos, true); setTimeout(postStatus, 300); }
    else control('seek', { position: pos });
    // optimistic local display until the next status frame
    if (state?.status) { state.status.position = pos; state.status.updatedAt = serverNow; frameAt = Date.now(); }
  });

  let volTimer = null;
  $('vol').addEventListener('input', () => {
    volAdjusting = true;
    clearTimeout(volTimer);
    const v = Number($('vol').value);
    volTimer = setTimeout(() => {
      volAdjusting = false;
      if (isPlayer && ytReady) { yt.setVolume(v); setTimeout(postStatus, 300); }
      else control('volume', { volume: v });
    }, 180);
  });

  // ---- share / copy room link --------------------------------------------
  $('codeChip').onclick = async () => {
    const link = location.origin + '/r/' + roomId;
    try {
      if (navigator.share) { await navigator.share({ title: `tunebox ${roomId}`, url: link }); return; }
      await navigator.clipboard.writeText(link);
      setIcon($('copyIcon'), 'check');
      setTimeout(() => setIcon($('copyIcon'), 'copy'), 1500);
    } catch { /* user cancelled share */ }
  };

  // ---- live updates ------------------------------------------------------
  let lastCmdSeq = null;
  const es = new EventSource(`/api/rooms/${roomId}/events`);
  es.addEventListener('state', (e) => {
    state = JSON.parse(e.data);
    serverNow = state.now || serverNow;
    frameAt = Date.now();
    if (lastCmdSeq === null) lastCmdSeq = state.control?.seq || 0; // never replay old commands
    render();
    if (isPlayer) handleControl();
  });
  es.addEventListener('status', (e) => {
    if (!state) return;
    const d = JSON.parse(e.data);
    state.status = d.status;
    serverNow = d.now || serverNow;
    frameAt = Date.now();
    renderStatus();
  });
  es.onerror = () => { /* EventSource auto-reconnects */ };

  // ---- remote transport buttons -----------------------------------------
  $('toggle').onclick = () => (isPlayer ? playerToggle() : control('toggle'));
  $('next').onclick = () => (isPlayer ? playNext(1) : control('next'));
  $('prev').onclick = () => (isPlayer ? playNext(-1) : control('prev'));

  // One input for everything: a YouTube link adds directly; anything else
  // (song name, Spotify/Apple Music link) goes through server-side search.
  const isYtInput = (v) => /^[\w-]{11}$/.test(v) || /(?:youtube\.com|youtu\.be|youtube-nocookie\.com)\//i.test(v);
  let searching = false;

  function setAddBtn() {
    const v = $('url').value.trim();
    const yt = isYtInput(v);
    $('add').replaceChildren(iconEl(searching ? 'search' : (yt ? 'plus' : 'search')),
      document.createTextNode(searching ? '搜尋中…' : (yt ? '加歌' : '搜尋')));
    $('add').disabled = searching;
  }
  setAddBtn();
  $('url').addEventListener('input', setAddBtn);

  const closeResults = () => { $('results').classList.remove('open'); $('results').replaceChildren(); };

  function renderResults(query, results) {
    const box = $('results');
    const head = document.createElement('div');
    head.className = 'rhead';
    const q = document.createElement('div');
    q.className = 'q';
    const qb = document.createElement('b');
    qb.textContent = query;
    q.append('「', qb, '」的結果 — 點一下加入');
    const closeBtn = document.createElement('button');
    closeBtn.append(iconEl('x'));
    closeBtn.setAttribute('aria-label', '關閉結果');
    closeBtn.onclick = closeResults;
    head.append(q, closeBtn);

    const cards = results.map((v) => {
      const card = document.createElement('div');
      card.className = 'rcard';
      const img = document.createElement('img');
      img.src = v.thumbnail;
      img.loading = 'lazy';
      img.alt = '';
      const info = document.createElement('div');
      info.className = 'info';
      const rt = document.createElement('div');
      rt.className = 'rt';
      rt.textContent = v.title;
      const rc = document.createElement('div');
      rc.className = 'rc';
      rc.textContent = [v.channel, v.duration].filter(Boolean).join(' · ');
      info.append(rt, rc);
      const act = document.createElement('span');
      act.className = 'act';
      act.append(iconEl('plus'));
      card.append(img, info, act);
      card.onclick = async () => {
        if (card.classList.contains('added')) return;
        const r = await api('/tracks', { url: `https://www.youtube.com/watch?v=${v.videoId}`, title: v.title });
        if (!r.success) return flash(r.error);
        card.classList.add('added');
        act.replaceChildren(iconEl('check'));
      };
      return card;
    });
    box.replaceChildren(head, ...cards);
    if (!results.length) {
      const none = document.createElement('div');
      none.className = 'rcard added';
      none.textContent = '找不到結果 — 換個關鍵字試試';
      box.append(none);
    }
    box.classList.add('open');
  }

  $('add').onclick = async () => {
    const v = $('url').value.trim();
    if (!v || searching) return;
    if (isYtInput(v)) {
      const r = await api('/tracks', { url: v });
      if (!r.success) return flash(r.error);
      $('url').value = '';
      setAddBtn();
      return;
    }
    searching = true;
    setAddBtn();
    try {
      const r = await fetch(`/api/rooms/${roomId}/search?q=${encodeURIComponent(v)}`)
        .then((x) => x.json()).catch(() => ({ success: false, error: '連不上伺服器' }));
      if (!r.success) return flash(r.error);
      renderResults(r.data.query, r.data.results);
    } finally {
      searching = false;
      setAddBtn();
    }
  };
  $('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('add').click(); });

  // ---- player mode -------------------------------------------------------
  let yt = null;
  let ytReady = false;
  let currentTrackId = null;
  let lastIndex = 0;          // where we were if the current track gets deleted
  let wakeLock = null;
  let statusTimer = null;
  let playerLoadToken = 0;    // invalidates an in-flight iframe-API load on exit
  let consecutiveErrors = 0;

  const trackById = (id) => state.queue.find((t) => t.id === id);
  const indexOfCurrent = () => state.queue.findIndex((t) => t.id === currentTrackId);

  async function acquireLock() {
    if (!navigator.wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch { /* unsupported / denied */ }
  }
  const reacquireLock = () => {
    if (document.visibilityState === 'visible' && isPlayer && !wakeLock) acquireLock();
  };

  async function enterPlayerMode() {
    // Another phone already playing? Don't silently start double audio.
    if (statusFresh() && !state.status.paused && state.status.playerId !== deviceId
        && !confirm('另一支手機好像正在播放中，仍要改在這支播放嗎？')) return;
    isPlayer = true;
    const token = ++playerLoadToken;
    lastCmdSeq = state?.control?.seq || 0;
    document.body.classList.add('playing');
    setModeBtn();
    acquireLock();
    document.addEventListener('visibilitychange', reacquireLock);
    if (!window.YT?.Player) {
      window.onYouTubeIframeAPIReady = () => { if (token === playerLoadToken && isPlayer) initPlayer(); };
      if (!document.getElementById('ytapi')) {
        const s = document.createElement('script');
        s.id = 'ytapi';
        s.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(s);
      }
    } else initPlayer();
    statusTimer = setInterval(postStatus, 10000);
  }
  function exitPlayerMode() {
    isPlayer = false;
    playerLoadToken += 1;
    window.onYouTubeIframeAPIReady = () => {};
    document.body.classList.remove('playing');
    setModeBtn();
    clearInterval(statusTimer);
    document.removeEventListener('visibilitychange', reacquireLock);
    wakeLock?.release().catch(() => {});
    wakeLock = null;
    if (yt) { yt.destroy(); yt = null; ytReady = false; }
    // yt.destroy() removes the #yt element — put the mount back for next time.
    if (!document.getElementById('yt')) {
      const mount = document.createElement('div');
      mount.id = 'yt';
      $('playerView').prepend(mount);
    }
    currentTrackId = null;
  }
  $('modeBtn').onclick = () => (isPlayer ? exitPlayerMode() : enterPlayerMode());

  function initPlayer() {
    if (!isPlayer) return;
    yt = new YT.Player('yt', {
      width: '100%', height: '100%',
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          ytReady = true;
          const first = state.queue[0];
          if (first) playTrack(first.id);
          handleControl(); // a command may have queued up while the API loaded
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING) consecutiveErrors = 0;
          if (e.data === YT.PlayerState.ENDED) playNext(1);
          else postStatus();
        },
        onError: () => {
          // unplayable / region-blocked → skip, but never spin on an all-bad queue
          consecutiveErrors += 1;
          if (consecutiveErrors >= Math.max(1, state.queue.length)) {
            consecutiveErrors = 0;
            flash('這些歌目前都播不了');
            return;
          }
          setTimeout(() => { if (isPlayer) playNext(1); }, 1000);
        }
      }
    });
  }

  function playTrack(trackId) {
    const t = trackById(trackId);
    if (!t || !ytReady) return;
    currentTrackId = trackId;
    lastIndex = indexOfCurrent();
    yt.loadVideoById(t.videoId);
    postStatus();
  }
  function playNext(dir) {
    if (!state.queue.length) return;
    let i = indexOfCurrent();
    // current track was deleted → continue from where it used to be
    if (i < 0) i = Math.min(lastIndex, state.queue.length - 1);
    else i = (i + dir + state.queue.length) % state.queue.length;
    playTrack(state.queue[i].id);
  }
  function playerToggle() {
    if (!ytReady) return;
    const st = yt.getPlayerState();
    if (st === YT.PlayerState.PLAYING) yt.pauseVideo(); else yt.playVideo();
    setTimeout(postStatus, 300);
  }

  // Execute remote commands exactly once, in arrival order. A command that
  // lands while the iframe API is still loading stays unconsumed and fires
  // from onReady — never acknowledged-and-dropped.
  function handleControl() {
    const c = state.control;
    if (!c || c.seq <= lastCmdSeq) return;
    if (!ytReady) return;
    lastCmdSeq = c.seq;
    if (c.cmd === 'toggle') playerToggle();
    else if (c.cmd === 'play') { yt.playVideo(); setTimeout(postStatus, 300); }
    else if (c.cmd === 'pause') { yt.pauseVideo(); setTimeout(postStatus, 300); }
    else if (c.cmd === 'next') playNext(1);
    else if (c.cmd === 'prev') playNext(-1);
    else if (c.cmd === 'jump' && c.trackId) playTrack(c.trackId);
    else if (c.cmd === 'seek' && Number.isFinite(c.position)) { yt.seekTo(c.position, true); setTimeout(postStatus, 300); }
    else if (c.cmd === 'volume' && Number.isFinite(c.volume)) { yt.setVolume(c.volume); setTimeout(postStatus, 300); }
  }

  function postStatus() {
    if (!isPlayer || !ytReady || !currentTrackId) return;
    const t = trackById(currentTrackId);
    api('/status', {
      trackId: currentTrackId,
      title: t?.title || null,
      position: yt.getCurrentTime?.() || 0,
      duration: yt.getDuration?.() || 0,
      paused: yt.getPlayerState?.() !== YT.PlayerState.PLAYING,
      volume: yt.getVolume?.(),
      playerId: deviceId
    });
  }

  // initial fetch in case SSE is slow to open
  fetch(`/api/rooms/${roomId}`).then((r) => r.json()).then((b) => {
    if (b.success && !state) {
      state = b.data;
      serverNow = state.now || Date.now();
      frameAt = Date.now();
      if (lastCmdSeq === null) lastCmdSeq = state.control?.seq || 0;
      render();
    }
    if (!b.success) { document.body.innerHTML = '<div style="padding:40px;text-align:center">房間不存在 — <a href="/" style="color:#4ade80">回首頁</a></div>'; }
  });
})();
</script>
</body>
</html>
